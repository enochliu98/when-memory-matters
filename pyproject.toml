[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "when-memory-matters"
version = "0.1.0"
description = "Matched head-to-head benchmarks for memory-guided LLM gameplay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textarena==0.7.4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4", "tqdm>=4,<5"]
dev = ["pytest>=8,<10"]

[project.scripts]
wmm-interfaces = "Bench.runner:main"
wmm-memory-items = "Bench.memory_compare:main"
wmm-models = "Bench.llm_compare:main"
wmm-screen = "Benchmark.screening.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["Bench", "langpsro", "langpsro.*", "Benchmark", "Benchmark.screening", "Benchmark.screening.*"]
exclude = ["*.results", "*.results.*", "*.runs", "*.runs.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

